
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Management System</title>
</head>
<body>

    <header>
        <h1>Case Management System</h1>
        <p>Canonical Person Management</p>
    </header>

    <main>
        <section id="search-section">
            <h2>Search Canonical People</h2>

            <form method="get" id="searchForm">
                <label for="searchQuery">Search Canonical People</label>
                <input type="text" name="searchQuery" id="searchQuery" placeholder="Search Canonical People">
                <button type="submit">Search</button>
            </form>

        </section>

        <section id="create-section">
            <h2>Add Canonical Person</h2>
            <form id="createForm">
                <label for="fname">First Name:</label>
                <input type="text" name="fname" id="fname" required>
                <br>
                <label for="mname">Middle Name:</label>
                <input type="text" name="mname" id="mname">
                <br>
                <label for="lname">Last Name:</label>
                <input type="text" name="lname" id="lname" required>
                <br>
                <label for="pfx">Prefix:</label>
                <input type="text" name="pfx" id="pfx">
                <br>
                <label for="sfx">Suffix:</label>
                <input type="text" name="sfx" id="sfx">
                <br>
                <button type="submit">Add</button>
            </form>
            <p id="create-result"></p>
        </section>

        <section id="results-section">
            <h2>Canonical People</h2>

            <!-- Results table goes here -->
             <table id="canonicalPeople">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">First Name</th>
                        <th scope="col">Middle Name</th>
                        <th scope="col">Last Name</th>
                        <th scope="col">Prefix</th>
                        <th scope="col">Suffix</th>
                        <th scope="col">Created At</th>
                        <th scope="col">Updated At</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody id="canonicalPeopleResults">
                </tbody>
             </table>
             <button id="refresh">Refresh Table</button>
        </section>

    </main>

    <script src="script.js" defer></script>
</body>
</html>
